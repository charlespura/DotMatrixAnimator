<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Dot-by-Dot Reveal | Direct MP4 + PNG/JPEG Download</title>
  <style>
    * {
      box-sizing: border-box;
      user-select: none;
    }

    body {
      background: radial-gradient(circle at 20% 30%, #0f111f, #05070f);
      font-family: 'Inter', 'Segoe UI', system-ui, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
    }

    .glass-container {
      max-width: 1300px;
      width: 100%;
      background: rgba(15, 19, 32, 0.75);
      backdrop-filter: blur(14px);
      border-radius: 2rem;
      padding: 1.6rem;
      box-shadow: 0 25px 45px -12px rgba(0, 0, 0, 0.6), 0 0 0 1px rgba(255, 255, 255, 0.05);
      transition: all 0.2s;
    }

    h1 {
      font-size: 1.9rem;
      font-weight: 700;
      margin: 0 0 0.2rem;
      background: linear-gradient(135deg, #FFFFFF, #b7ccff);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      letter-spacing: -0.3px;
    }

    .sub {
      color: #9aa5ce;
      font-size: 0.9rem;
      margin-bottom: 1.5rem;
      border-left: 3px solid #5f7cff;
      padding-left: 14px;
    }

    .flex-main {
      display: flex;
      flex-wrap: wrap;
      gap: 1.8rem;
    }

    .controls {
      flex: 1.2;
      min-width: 260px;
      background: rgba(8, 11, 22, 0.6);
      border-radius: 1.5rem;
      padding: 1.3rem;
      display: flex;
      flex-direction: column;
      gap: 1.2rem;
    }

    .canvas-area {
      flex: 2.5;
      min-width: 340px;
      background: #03050c;
      border-radius: 1.5rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 1rem;
      box-shadow: inset 0 0 0 1px rgba(255,255,255,0.03), 0 12px 28px black;
    }

    canvas {
      display: block;
      width: 100%;
      height: auto;
      background: #000000;
      border-radius: 1rem;
      box-shadow: 0 8px 24px rgba(0,0,0,0.5);
    }

    button {
      background: #252c48;
      border: none;
      padding: 10px 14px;
      border-radius: 60px;
      font-weight: 600;
      font-size: 0.85rem;
      color: #f0f3ff;
      cursor: pointer;
      transition: 0.2s;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      font-family: inherit;
      border: 1px solid rgba(255,255,255,0.08);
    }

    button.primary {
      background: #4f6eff;
      color: white;
      box-shadow: 0 4px 12px rgba(79, 110, 255, 0.3);
    }

    button.primary:hover {
      background: #3b5be0;
      transform: scale(0.98);
    }

    button.download-mp4 {
      background: #b8405e;
      box-shadow: 0 2px 10px rgba(184, 64, 94, 0.3);
    }

    button.download-mp4:hover {
      background: #9e2e4a;
    }

    button:hover {
      background: #363f62;
    }

    .btn-group {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .row-btns {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
    }

    .file-label {
      background: #1e233e;
      padding: 10px 14px;
      text-align: center;
      border-radius: 60px;
      font-weight: 500;
      cursor: pointer;
      transition: 0.2s;
      width: 100%;
    }

    input[type="file"] {
      display: none;
    }

    .slider-container {
      display: flex;
      flex-direction: column;
      gap: 5px;
    }

    .slider-container label {
      font-size: 0.75rem;
      font-weight: 500;
      color: #cdd6ff;
    }

    input[type="range"] {
      background: #10131f;
      height: 4px;
      border-radius: 4px;
    }

    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 14px;
      height: 14px;
      background: #7c96ff;
      border-radius: 50%;
      cursor: pointer;
    }

    .status {
      background: #0b0e1a;
      border-radius: 40px;
      padding: 8px 12px;
      font-size: 0.7rem;
      font-family: monospace;
      text-align: center;
      color: #c2caf0;
    }

    .badge-note {
      font-size: 0.7rem;
      text-align: center;
      color: #7c87b0;
      margin-top: 4px;
    }

    hr {
      border-color: rgba(255,255,255,0.05);
      margin: 6px 0;
    }
  </style>
  <!-- CCapture.js for MP4 generation (WebM) -->
  <script src="https://cdn.jsdelivr.net/npm/ccapture.js@1.1.0/build/CCapture.min.js"></script>
</head>
<body>
<div class="glass-container">
  <h1>◉ DOT BY DOT · POINTILLISM STUDIO</h1>
  <div class="sub">upload image → watch dot-by-dot transition → download as MP4, PNG, or JPEG</div>

  <div class="flex-main">
    <!-- LEFT CONTROLS -->
    <div class="controls">
      <label class="file-label" for="imageUpload">📁 UPLOAD IMAGE (JPG/PNG/WEBP)</label>
      <input type="file" id="imageUpload" accept="image/jpeg, image/png, image/jpg, image/webp">

      <div class="btn-group">
        <button id="startAnimBtn" class="primary">✨ START DOT ANIMATION</button>
        <button id="resetAnimBtn">⟳ RESET (fresh reveal order)</button>
      </div>

      <div class="slider-container">
        <label>🎯 DOT SIZE: <span id="dotSizeVal">5.0</span> px</label>
        <input type="range" id="dotSizeSlider" min="2" max="14" step="0.5" value="5.0">
      </div>
      <div class="slider-container">
        <label>⚡ SPEED (dots/frame): <span id="speedVal">85</span></label>
        <input type="range" id="speedSlider" min="25" max="400" step="5" value="85">
      </div>
      <div class="slider-container">
        <label>🔘 DOT SPACING (grid step): <span id="stepVal">6</span> px</label>
        <input type="range" id="stepSlider" min="4" max="16" step="1" value="6">
      </div>

      <div class="status" id="statusMsg">
        🎨 Ready — upload an image
      </div>

      <div class="badge-note">▼ DIRECT DOWNLOAD BUTTONS ▼</div>
      <div class="row-btns">
        <button id="downloadMp4Btn" class="download-mp4">🎬 DOWNLOAD AS MP4 (WebM)</button>
      </div>
      <div class="row-btns">
        <button id="exportPngBtn" style="background:#2a5f6e;">📸 EXPORT PNG</button>
        <button id="exportJpegBtn" style="background:#2a5f6e;">🖼️ EXPORT JPEG</button>
      </div>
      <div class="badge-note" style="margin-top: 8px;">
        💡 MP4: Records the full dot-reveal animation from empty to complete & downloads automatically.
      </div>
    </div>

    <!-- CANVAS PREVIEW -->
    <div class="canvas-area">
      <canvas id="dotCanvas" width="700" height="700" style="width:100%; max-width:700px; aspect-ratio:1/1; border-radius: 1rem;"></canvas>
      <div style="margin-top: 12px; font-size: 11px; color:#6f7aaa;">⬇ live preview — organic dot transition</div>
    </div>
  </div>
</div>

<script>
  (function() {
    // ---------- DOM elements ----------
    const canvas = document.getElementById('dotCanvas');
    const ctx = canvas.getContext('2d');
    const imgUpload = document.getElementById('imageUpload');
    const startBtn = document.getElementById('startAnimBtn');
    const resetBtn = document.getElementById('resetAnimBtn');
    const downloadMp4Btn = document.getElementById('downloadMp4Btn');
    const exportPngBtn = document.getElementById('exportPngBtn');
    const exportJpegBtn = document.getElementById('exportJpegBtn');
    
    const dotSizeSlider = document.getElementById('dotSizeSlider');
    const dotSizeVal = document.getElementById('dotSizeVal');
    const speedSlider = document.getElementById('speedSlider');
    const speedVal = document.getElementById('speedVal');
    const stepSlider = document.getElementById('stepSlider');
    const stepVal = document.getElementById('stepVal');
    const statusDiv = document.getElementById('statusMsg');

    // ---------- canvas fixed dimensions ----------
    const CANVAS_W = 700;
    const CANVAS_H = 700;
    canvas.width = CANVAS_W;
    canvas.height = CANVAS_H;

    // ---------- core animation data ----------
    let originalImageData = null;      // ImageData from uploaded image
    let dotGrid = [];                  // array of {x, y, r, g, b}
    let revealed = [];                 // boolean flags
    let revealOrder = [];              // shuffled indices for organic appearance
    let currentRevealCount = 0;
    let animationId = null;
    let isAnimating = false;
    
    // user parameters
    let dotSize = 5.0;
    let step = 6;
    let dotsPerFrame = 85;
    
    // recording helper flag (to avoid conflict)
    let isGeneratingMP4 = false;
    let pendingVideoDownload = null; // { url, filename }
    
    // ---------- helper: draw placeholder ----------
    function drawPlaceholder() {
      ctx.fillStyle = "#080b14";
      ctx.fillRect(0, 0, CANVAS_W, CANVAS_H);
      ctx.fillStyle = "#cbd5ff";
      ctx.font = "bold 18px 'Inter', system-ui";
      ctx.textAlign = "center";
      ctx.fillText("⬆ UPLOAD AN IMAGE ⬆", CANVAS_W/2, CANVAS_H/2 - 20);
      ctx.font = "13px monospace";
      ctx.fillStyle = "#8f9cd0";
      ctx.fillText("dot-by-dot pointillism transition", CANVAS_W/2, CANVAS_H/2 + 20);
    }
    drawPlaceholder();
    
    // ---------- rebuild dot grid from image data using current step ----------
    function buildDotGridFromImageData() {
      if (!originalImageData) return [];
      const grid = [];
      for (let y = 0; y < CANVAS_H; y += step) {
        for (let x = 0; x < CANVAS_W; x += step) {
          const ix = Math.min(Math.floor(x), CANVAS_W-1);
          const iy = Math.min(Math.floor(y), CANVAS_H-1);
          const idx = (iy * CANVAS_W + ix) * 4;
          const r = originalImageData.data[idx];
          const g = originalImageData.data[idx+1];
          const b = originalImageData.data[idx+2];
          grid.push({ x: ix, y: iy, r, g, b });
        }
      }
      return grid;
    }
    
    // reset reveal state (all hidden, random order)
    function resetRevealState() {
      if (animationId) {
        cancelAnimationFrame(animationId);
        animationId = null;
      }
      isAnimating = false;
      if (!dotGrid.length && originalImageData) {
        dotGrid = buildDotGridFromImageData();
      }
      if (dotGrid.length === 0) return;
      
      revealed = new Array(dotGrid.length).fill(false);
      revealOrder = Array.from({ length: dotGrid.length }, (_, i) => i);
      // Fisher-Yates shuffle
      for (let i = revealOrder.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [revealOrder[i], revealOrder[j]] = [revealOrder[j], revealOrder[i]];
      }
      currentRevealCount = 0;
      renderDots();
    }
    
    // render only revealed dots
    function renderDots() {
      if (!ctx) return;
      ctx.fillStyle = "#03050c";
      ctx.fillRect(0, 0, CANVAS_W, CANVAS_H);
      if (!dotGrid.length) {
        if (!originalImageData) drawPlaceholder();
        return;
      }
      for (let i = 0; i < dotGrid.length; i++) {
        if (revealed[i]) {
          const d = dotGrid[i];
          ctx.beginPath();
          ctx.arc(d.x, d.y, dotSize/2, 0, Math.PI * 2);
          ctx.fillStyle = `rgb(${d.r}, ${d.g}, ${d.b})`;
          ctx.fill();
        }
      }
    }
    
    // animation loop: reveals dotsPerFrame dots each frame
    function animationStep() {
      if (!isAnimating) return;
      if (!dotGrid.length) {
        stopAnimation();
        statusDiv.innerHTML = "⚠️ No dot grid. Upload image first.";
        return;
      }
      
      const totalDots = dotGrid.length;
      let limit = Math.min(dotsPerFrame, totalDots - currentRevealCount);
      for (let i = 0; i < limit; i++) {
        if (currentRevealCount >= totalDots) break;
        const idx = revealOrder[currentRevealCount];
        if (!revealed[idx]) {
          revealed[idx] = true;
        }
        currentRevealCount++;
      }
      
      renderDots();
      
      if (currentRevealCount >= totalDots) {
        stopAnimation();
        statusDiv.innerHTML = `✅ Complete! All ${totalDots} dots revealed. You can download MP4 / PNG / JPEG.`;
      } else {
        animationId = requestAnimationFrame(animationStep);
      }
    }
    
    function startAnimation() {
      if (isAnimating) {
        statusDiv.innerHTML = "⏳ Animation already running.";
        return;
      }
      if (!originalImageData) {
        statusDiv.innerHTML = "❌ Please upload an image first.";
        return;
      }
      if (dotGrid.length === 0) {
        dotGrid = buildDotGridFromImageData();
        if (dotGrid.length === 0) return;
        resetRevealState();
      }
      // if already fully revealed, reset to get fresh reveal effect
      if (currentRevealCount >= dotGrid.length) {
        resetRevealState();
      }
      isAnimating = true;
      statusDiv.innerHTML = `✨ Animating ... ${dotsPerFrame} dots/frame ✨`;
      animationId = requestAnimationFrame(animationStep);
    }
    
    function stopAnimation() {
      if (animationId) {
        cancelAnimationFrame(animationId);
        animationId = null;
      }
      isAnimating = false;
    }
    
    function fullReset() {
      if (isGeneratingMP4) {
        statusDiv.innerHTML = "⏳ Please wait, MP4 generation in progress...";
        return;
      }
      stopAnimation();
      if (originalImageData) {
        dotGrid = buildDotGridFromImageData();
        resetRevealState();
        statusDiv.innerHTML = "⟳ Reset complete. Press START for fresh dot animation.";
      } else {
        drawPlaceholder();
      }
    }
    
    // load image and init
    function loadAndProcessImage(file) {
      if (!file) return;
      const reader = new FileReader();
      reader.onload = (e) => {
        const img = new Image();
        img.onload = () => {
          const offCanvas = document.createElement('canvas');
          offCanvas.width = CANVAS_W;
          offCanvas.height = CANVAS_H;
          const offCtx = offCanvas.getContext('2d');
          offCtx.drawImage(img, 0, 0, CANVAS_W, CANVAS_H);
          const imgData = offCtx.getImageData(0, 0, CANVAS_W, CANVAS_H);
          originalImageData = imgData;
          dotGrid = buildDotGridFromImageData();
          resetRevealState();
          statusDiv.innerHTML = `✅ Loaded: ${dotGrid.length} dots (spacing ${step}px). Press START.`;
        };
        img.src = e.target.result;
      };
      reader.readAsDataURL(file);
    }
    
    // ---------- MP4 generation WITHOUT manual record/stop (one-click download) ----------
    function pickBestVideoMimeType() {
      if (typeof MediaRecorder === 'undefined' || typeof MediaRecorder.isTypeSupported !== 'function') return null;
      const candidates = [
        // Prefer MP4 when available (mainly Safari)
        'video/mp4;codecs=avc1.42E01E',
        'video/mp4',
        // Chrome/Firefox
        'video/webm;codecs=vp9',
        'video/webm;codecs=vp8',
        'video/webm'
      ];
      for (const type of candidates) {
        if (MediaRecorder.isTypeSupported(type)) return type;
      }
      return null;
    }

    function getExtensionFromMime(mimeType) {
      if (!mimeType) return 'webm';
      if (mimeType.includes('mp4')) return 'mp4';
      return 'webm';
    }

    function setPendingVideoDownload(url, filename) {
      // Clean up any previous pending URL
      if (pendingVideoDownload?.url) {
        try { URL.revokeObjectURL(pendingVideoDownload.url); } catch {}
      }
      pendingVideoDownload = { url, filename };
      downloadMp4Btn.textContent = "⬇️ TAP AGAIN TO SAVE VIDEO";
      downloadMp4Btn.classList.add('primary');
    }

    function clearPendingVideoDownload() {
      if (pendingVideoDownload?.url) {
        try { URL.revokeObjectURL(pendingVideoDownload.url); } catch {}
      }
      pendingVideoDownload = null;
      downloadMp4Btn.textContent = "🎬 DOWNLOAD AS MP4 (WebM)";
      downloadMp4Btn.classList.remove('primary');
    }

    function tryTriggerDownload(url, filename) {
      const a = document.createElement('a');
      a.href = url;
      a.download = filename;
      a.rel = 'noopener';
      a.style.display = 'none';
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
    }

    async function generateAndDownloadMP4() {
      if (!originalImageData || dotGrid.length === 0) {
        statusDiv.innerHTML = "❌ No image loaded. Please upload an image first.";
        return;
      }
      if (isGeneratingMP4) {
        statusDiv.innerHTML = "⏳ MP4 generation already in progress, please wait...";
        return;
      }

      // If a video is already prepared (some mobile browsers block auto-download),
      // let the user tap again to trigger a user-gesture download.
      if (pendingVideoDownload) {
        tryTriggerDownload(pendingVideoDownload.url, pendingVideoDownload.filename);
        statusDiv.innerHTML = "✅ Download triggered. If your browser opened a new tab, use its Save/Share option.";
        // Keep the URL around briefly in case the browser ignores `download`
        setTimeout(() => clearPendingVideoDownload(), 8000);
        return;
      }
      clearPendingVideoDownload();
      
      // stop any ongoing animation to avoid conflicts
      stopAnimation();
      
      // store current dot grid & revealed state to restore later
      const originalDotGrid = [...dotGrid];
      const originalRevealed = [...revealed];
      const originalRevealOrder = [...revealOrder];
      const originalRevealCount = currentRevealCount;
      const originalIsAnimating = isAnimating;
      
      // create a fresh isolated state for recording: start from empty
      // but we must keep the same dotGrid (colors/positions) and reset reveal
      dotGrid = buildDotGridFromImageData();  // rebuild (ensures up-to-date step)
      const totalDots = dotGrid.length;
      // generate fresh random order for organic recording (same as normal experience)
      const freshOrder = Array.from({ length: totalDots }, (_, i) => i);
      for (let i = freshOrder.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [freshOrder[i], freshOrder[j]] = [freshOrder[j], freshOrder[i]];
      }
      
      // Render initial empty canvas
      ctx.fillStyle = "#03050c";
      ctx.fillRect(0, 0, CANVAS_W, CANVAS_H);
      
      isGeneratingMP4 = true;
      statusDiv.innerHTML = "🎬 Recording video... please wait ⏳";

      const fps = 30;
      const intervalTime = 1000 / fps;
      const revealedRecording = new Array(totalDots).fill(false);
      const recordingOrder = [...freshOrder];
      let recordingRevealCount = 0;

      const canUseMediaRecorder =
        typeof canvas.captureStream === 'function' &&
        typeof MediaRecorder !== 'undefined';

      let stream = null;
      let recorder = null;
      let capturer = null;
      let chunks = [];
      let chosenMime = null;

      try {
        if (canUseMediaRecorder) {
          stream = canvas.captureStream(fps);
          chosenMime = pickBestVideoMimeType();
          recorder = new MediaRecorder(stream, chosenMime ? { mimeType: chosenMime } : undefined);
          chunks = [];
          recorder.ondataavailable = (e) => {
            if (e.data && e.data.size > 0) chunks.push(e.data);
          };
          recorder.start(250);
        } else {
          // Fallback: CCapture if MediaRecorder isn't available
          if (typeof CCapture === 'undefined') {
            isGeneratingMP4 = false;
            statusDiv.innerHTML = "❌ Your browser can't record video here. Try Chrome/Edge.";
            dotGrid = originalDotGrid;
            revealed = originalRevealed;
            revealOrder = originalRevealOrder;
            currentRevealCount = originalRevealCount;
            renderDots();
            return;
          }

          capturer = new CCapture({
            format: 'webm',
            framerate: fps,
            quality: 90,
            name: 'dot_reveal',
            verbose: false
          });
          capturer.start();
          capturer.capture(canvas);
        }

        const intervalId = setInterval(() => {
          if (!isGeneratingMP4) {
            clearInterval(intervalId);
            return;
          }

          for (let i = 0; i < dotsPerFrame; i++) {
            if (recordingRevealCount >= totalDots) break;
            const idx = recordingOrder[recordingRevealCount];
            revealedRecording[idx] = true;
            recordingRevealCount++;
          }

          ctx.fillStyle = "#03050c";
          ctx.fillRect(0, 0, CANVAS_W, CANVAS_H);
          for (let i = 0; i < dotGrid.length; i++) {
            if (revealedRecording[i]) {
              const d = dotGrid[i];
              ctx.beginPath();
              ctx.arc(d.x, d.y, dotSize/2, 0, Math.PI * 2);
              ctx.fillStyle = `rgb(${d.r}, ${d.g}, ${d.b})`;
              ctx.fill();
            }
          }

          if (capturer) capturer.capture(canvas);

          if (recordingRevealCount >= totalDots) {
            clearInterval(intervalId);

            const finalize = async () => {
              // Restore previous canvas state (original grid and revealed)
              dotGrid = originalDotGrid;
              revealed = originalRevealed;
              revealOrder = originalRevealOrder;
              currentRevealCount = originalRevealCount;
              renderDots();
              isGeneratingMP4 = false;
            };

            if (recorder) {
              recorder.addEventListener('stop', async () => {
                try {
                  const mimeType = recorder.mimeType || chosenMime || 'video/webm';
                  const blob = new Blob(chunks, { type: mimeType });
                  const ext = getExtensionFromMime(mimeType);
                  const filename = `dot_reveal_${Date.now()}.${ext}`;
                  const url = URL.createObjectURL(blob);

                  // Try auto-download; also keep a "tap again" fallback for mobile browsers.
                  setPendingVideoDownload(url, filename);
                  tryTriggerDownload(url, filename);
                  statusDiv.innerHTML = "✅ Video ready. If it didn’t download, tap DOWNLOAD again.";
                } catch (err) {
                  statusDiv.innerHTML = "❌ Recording finished, but download failed.";
                  console.error(err);
                } finally {
                  await finalize();
                }
              }, { once: true });

              try {
                recorder.stop();
              } catch (err) {
                statusDiv.innerHTML = "❌ Could not stop recorder.";
                console.error(err);
                finalize();
              } finally {
                if (stream) {
                  try { stream.getTracks().forEach(t => t.stop()); } catch {}
                }
              }
            } else {
              try {
                capturer.stop();
                capturer.save((blob) => {
                  try {
                    const url = URL.createObjectURL(blob);
                    const filename = `dot_reveal_${Date.now()}.webm`;
                    setPendingVideoDownload(url, filename);
                    tryTriggerDownload(url, filename);
                    statusDiv.innerHTML = "✅ Video ready. If it didn’t download, tap DOWNLOAD again.";
                  } catch (err) {
                    statusDiv.innerHTML = "❌ Video generated, but download failed.";
                    console.error(err);
                  } finally {
                    finalize();
                  }
                });
              } catch (err) {
                statusDiv.innerHTML = "❌ Video generation failed.";
                console.error(err);
                finalize();
              }
            }
          }
        }, intervalTime);
      } catch (err) {
        // Ensure we restore state if MediaRecorder fails to start
        isGeneratingMP4 = false;
        statusDiv.innerHTML = "❌ Could not start video recording on this browser.";
        console.error(err);
        dotGrid = originalDotGrid;
        revealed = originalRevealed;
        revealOrder = originalRevealOrder;
        currentRevealCount = originalRevealCount;
        renderDots();
        if (stream) {
          try { stream.getTracks().forEach(t => t.stop()); } catch {}
        }
      }
    }
    
    // ---------- PNG / JPEG export (current frame) ----------
    function exportPNG() {
      if (!originalImageData && dotGrid.length === 0) {
        statusDiv.innerHTML = "⚠️ No image loaded. Upload an image first.";
        return;
      }
      const link = document.createElement('a');
      link.download = `dot_art_${Date.now()}.png`;
      link.href = canvas.toDataURL('image/png');
      link.click();
      statusDiv.innerHTML = "📸 PNG saved!";
    }
    
    function exportJPEG() {
      if (!originalImageData && dotGrid.length === 0) {
        statusDiv.innerHTML = "⚠️ No image loaded.";
        return;
      }
      const link = document.createElement('a');
      link.download = `dot_art_${Date.now()}.jpg`;
      link.href = canvas.toDataURL('image/jpeg', 0.92);
      link.click();
      statusDiv.innerHTML = "🖼️ JPEG saved!";
    }
    
    // ---------- slider events & dynamic update ----------
    function updateDotSize() {
      dotSize = parseFloat(dotSizeSlider.value);
      dotSizeVal.innerText = dotSize;
      if (!isAnimating && !isGeneratingMP4) renderDots();
      else if (!isGeneratingMP4) renderDots();
    }
    
    function updateSpeed() {
      dotsPerFrame = parseInt(speedSlider.value);
      speedVal.innerText = dotsPerFrame;
    }
    
    function updateStep() {
      const newStep = parseInt(stepSlider.value);
      if (newStep !== step && originalImageData) {
        step = newStep;
        stepVal.innerText = step;
        dotGrid = buildDotGridFromImageData();
        if (!isAnimating && !isGeneratingMP4) {
          resetRevealState();
        } else if (!isGeneratingMP4) {
          stopAnimation();
          resetRevealState();
        }
        statusDiv.innerHTML = `🔄 Spacing updated: ${step}px, ${dotGrid.length} dots.`;
      } else {
        step = newStep;
        stepVal.innerText = step;
        if (originalImageData && !isGeneratingMP4) {
          dotGrid = buildDotGridFromImageData();
          if (!isAnimating) resetRevealState();
        }
      }
    }
    
    // ---------- Event Listeners ----------
    imgUpload.addEventListener('change', (e) => {
      if (e.target.files && e.target.files[0]) {
        if (isGeneratingMP4) {
          statusDiv.innerHTML = "Please wait, MP4 generation in progress...";
          return;
        }
        clearPendingVideoDownload();
        stopAnimation();
        loadAndProcessImage(e.target.files[0]);
      }
    });
    
    startBtn.addEventListener('click', () => {
      if (isGeneratingMP4) {
        statusDiv.innerHTML = "⏳ MP4 generation ongoing, please wait...";
        return;
      }
      clearPendingVideoDownload();
      startAnimation();
    });
    
    resetBtn.addEventListener('click', () => {
      if (isGeneratingMP4) {
        statusDiv.innerHTML = "Cannot reset while generating MP4.";
        return;
      }
      clearPendingVideoDownload();
      fullReset();
    });
    
    downloadMp4Btn.addEventListener('click', () => {
      generateAndDownloadMP4();
    });
    
    exportPngBtn.addEventListener('click', exportPNG);
    exportJpegBtn.addEventListener('click', exportJPEG);
    
    dotSizeSlider.addEventListener('input', updateDotSize);
    speedSlider.addEventListener('input', updateSpeed);
    stepSlider.addEventListener('input', updateStep);
    
    // initialize ui values
    updateDotSize();
    updateSpeed();
    updateStep();
  })();
</script>
</body>
</html>
